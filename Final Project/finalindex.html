<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Employee Management System</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="finalstyle.css" />
</head>
<body>

  <header class="masthead">
    <h1 class="masthead__title">Employee Management System</h1>
    <div class="masthead__clock">
      <span id="today"></span>
      <span id="time"></span>
    </div>
  </header>

  <main class="dashboard">

    
    <p id="loadingMessage" class="status status--loading"></p>
    <p id="statusMessage" class="status"></p>

    
    <section class="toolbar">
      <div class="toolbar__search">
        <input
          type="text"
          id="searchInput"
          placeholder="Search employee by name..."
          aria-label="Search employee by name"
        />
        <button id="searchButton" type="button">Search</button>
      </div>

      <div class="toolbar__departments" id="departmentButtons">
        <button type="button" class="dept-btn is-active" data-department="All">All Employees</button>
        <button type="button" class="dept-btn" data-department="IT">IT</button>
        <button type="button" class="dept-btn" data-department="HR">HR</button>
        <button type="button" class="dept-btn" data-department="Finance">Finance</button>
        <button type="button" class="dept-btn" data-department="Marketing">Marketing</button>
      </div>

      <div class="toolbar__sort">
        <label for="sortSelect">Sort by</label>
        <select id="sortSelect">
          <option value="">Default</option>
          <option value="name">Name (A–Z)</option>
          <option value="age">Age (Low–High)</option>
          <option value="salary">Salary (High–Low)</option>
        </select>
      </div>
    </section>

    
    <section class="stats">
      <div class="stats__item">
        <span class="stats__value" id="employeeCount">0</span>
        <span class="stats__label">Employees shown</span>
      </div>
      <div class="stats__item">
        <span class="stats__value" id="totalSalary">₹0</span>
        <span class="stats__label">Total salary</span>
      </div>
      <div class="stats__item">
        <span class="stats__value" id="averageSalary">₹0</span>
        <span class="stats__label">Average salary</span>
      </div>
      <div class="stats__item stats__item--highlight">
        <span class="stats__value" id="highestEmployee">—</span>
        <span class="stats__label">Highest paid</span>
      </div>
    </section>

    
    <section class="employee-grid" id="employeeContainer">
      
    </section>

    
    <section class="add-panel">
      <h2 class="add-panel__title">Add Employee</h2>

      <form id="employeeForm" class="add-form" novalidate>
        <div class="add-form__field">
          <label for="nameInput">Name</label>
          <input type="text" id="nameInput" placeholder="e.g. firstname lastname " />
          <span class="error" id="nameError"></span>
        </div>

        <div class="add-form__field">
          <label for="ageInput">Age</label>
          <input type="number" id="ageInput" placeholder="e.g. 25" />
          <span class="error" id="ageError"></span>
        </div>

        <div class="add-form__field">
          <label for="emailInput">Email</label>
          <input type="email" id="emailInput" placeholder="e.g. name@email.com" />
          <span class="error" id="emailError"></span>
        </div>

        <div class="add-form__field">
          <label for="departmentInput">Department</label>
          <select id="departmentInput">
            <option value="">Select department</option>
            <option value="IT">IT</option>
            <option value="HR">HR</option>
            <option value="Finance">Finance</option>
            <option value="Marketing">Marketing</option>
          </select>
          <span class="error" id="departmentError"></span>
        </div>

        <div class="add-form__field">
          <label for="salaryInput">Salary (₹)</label>
          <input type="number" id="salaryInput" placeholder="e.g. 50000" />
        </div>

        <button type="submit" class="add-form__submit">Add Employee</button>
      </form>
    </section>

  </main>

  <script src="finalscript.js"></script>
</body>
</html>
